# CI — the full quality gate for every push and PR.
#
# quality:  lint + typecheck + unit tests with v8 coverage (summary into the
#           run's step summary, lcov/json uploaded as an artifact)
# build:    production build (the deploy dry run)
# e2e:      Playwright suite against a production build + fresh temp SQLite DB
#
# Action pins are the latest stable majors at setup time (verified via the
# GitHub API): checkout v7, setup-node v7, upload-artifact v7. Dependabot
# keeps them current.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck & unit tests (coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Write coverage summary
        if: always()
        run: |
          node -e '
          const fs = require("node:fs");
          const s = require("./coverage/coverage-summary.json").total;
          const row = (k) => "| " + k + " | " + s[k].covered + "/" + s[k].total + " | " + (s[k].pct ?? 0).toFixed(2) + "% |";
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            "### Coverage\n\n" +
            "| | Covered | % |\n|---|---|---|\n" +
            row("statements") + "\n" + row("branches") + "\n" +
            row("functions") + "\n" + row("lines") + "\n");
          ' || echo "coverage summary unavailable"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # All integration envs are stub-safe; the secret is only read at
          # request time, never inlined into the build.
          AUTH_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef

  e2e:
    name: E2E (Playwright, production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !success() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

# GitHub Pages — static landing page + playable engine demo (site/).
#
# The app itself is full-stack (SQLite, server-side grading) and cannot run
# on Pages; what deploys here is the static site built by
# `npm run site:build`: site/index.html plus one esbuild bundle that pulls
# the pure drill engine and skill catalog from src/. Typecheck runs first
# because esbuild strips types without checking them.
#
# Pages is configured with build_type=workflow (set once via the API); this
# branch (ghpages) is the deploy branch. Action pins are the latest stable
# majors (verified via the GitHub API), matching ci.yml.
name: Pages

on:
  push:
    branches: [ghpages]
  workflow_dispatch:
    # Manual re-deploys of ghpages itself; the job gate below keeps a dispatch
    # from any other branch from replacing the live site.


concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Build & deploy static site
    if: github.ref == 'refs/heads/ghpages'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (esbuild does not typecheck)
        run: npm run typecheck

      - name: Build static site
        run: npm run site:build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v5

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint (via eslint-config-next) does not support TS 7 yet
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      - dependency-name: typescript
        versions: ["7.x"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
